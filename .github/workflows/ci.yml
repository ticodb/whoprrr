name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Virtual mic driver
        run: |
          ./Driver/build-driver.sh
          clang -o Driver/build/driver_test Driver/test/driver_test.c -framework CoreAudio -framework CoreFoundation
          Driver/build/driver_test Driver/build/WhopperMic.driver
      - name: App bundle (ad-hoc)
        run: SIGN_IDENTITY="-" ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: Whoprrr-ci-build, path: build/Whoprrr.app }
