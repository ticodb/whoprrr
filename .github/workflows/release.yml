name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the build number is the commit count
      - name: Test
        run: swift test
      - name: Build dmg and zip (ad-hoc signed)
        run: SIGN_IDENTITY="-" scripts/release.sh
      - name: Publish pre-release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" dist/* --prerelease --title "Whoprrr ${{ github.ref_name }}" --notes-file CHANGELOG.md
